# NOTE: Run `mise bootstrap` in the dotfiles directory

[bootstrap.packages]
# Formulae for libraries and tools the mise registry lacks
"brew:aarch64-elf-gdb" = "latest"
"brew:coreutils" = "latest"
"brew:docker-compose" = "latest"
"brew:docker-credential-helper" = "latest"
"brew:gnupg" = "latest"
"brew:libpq" = "latest"
"brew:luv" = "latest"
"brew:pinentry-mac" = "latest"
"brew:jorgelbg/tap/pinentry-touchid" = "latest"
"brew:terminal-notifier" = "latest"
"brew:tree" = "latest"
"brew:wget" = "latest"
"brew:yukiarrr/tap/ecsk" = "latest"
"brew:zsh-completions" = "latest"
# The GitHub release nests the binary where mise's github backend cannot find it
"brew:rubyfmt" = "latest"

"brew-cask:abue-ammar/tinycast/tinycast" = "latest"
"brew-cask:chromium" = "latest"
"brew-cask:font-fira-code-nerd-font" = "latest"
"brew-cask:font-monaspace" = "latest"
"brew-cask:fontbase" = "latest"
"brew-cask:ghostty" = "latest"
"brew-cask:google-chrome@dev" = "latest"
"brew-cask:google-japanese-ime" = "latest"
"brew-cask:karabiner-elements" = "latest"
"brew-cask:rancher" = "latest"
"brew-cask:session-manager-plugin" = "latest"
"brew-cask:slack" = "latest"
"brew-cask:spotify" = "latest"
"brew-cask:twingate" = "latest"

[bootstrap.brew.taps]
"abue-ammar/tinycast" = "https://github.com/abue-ammar/homebrew-tinycast.git"
"jorgelbg/tap" = "https://github.com/jorgelbg/homebrew-tap.git"
"yukiarrr/tap" = "https://github.com/yukiarrr/homebrew-tap.git"

# compinit ignores completions under a group-writable directory.
[bootstrap.hooks.post-packages]
run = ["chmod 755 /opt/homebrew/share"]

[dotfiles]
"~/.config/mise/config.toml" = "mise/global.toml"
"~/.zshrc" = "zsh/.zshrc"
"~/.config/starship.toml" = "starship/starship.toml"
"~/.config/ghostty/config" = "ghostty/config"
"~/.config/git/config" = "git/config"
"~/.config/git/ignore" = "git/ignore"
"~/.config/nvim/init.lua" = "nvim/init.lua"
"~/.config/zed/settings.json" = "zed/settings.json"
"~/.psqlrc" = "postgres/.psqlrc"
"~/.claude/CLAUDE.md" = "claude/CLAUDE.md"
"~/.claude/settings.json" = "claude/settings.json"
# Link the directory, not karabiner.json: Karabiner replaces a symlinked file with a regular one on save.
"~/.config/karabiner" = "karabiner"

# mise refuses to replace a target it did not create, so a real directory left by Karabiner is moved aside.
[bootstrap.hooks.pre-dotfiles]
run = [
  'target="$HOME/.config/karabiner"; if [ -e "$target" ] && [ ! -L "$target" ]; then mv "$target" "$target.bak.$(date +%Y%m%d%H%M%S)"; fi',
]

# Runs last in `mise bootstrap`.
[tasks.bootstrap]
description = "run the setup steps mise bootstrap cannot declare"
depends = ["claude-install"]

# Types must match the plist: mise treats 64 and 64.0 as different values.
[bootstrap.macos.defaults.NSGlobalDomain]
KeyRepeat = 2
InitialKeyRepeat = 15
"com.apple.mouse.scaling" = 0.6875
"com.apple.scrollwheel.scaling" = 0.5
shouldShowRSVPDataDetectors = false
AppleIconAppearanceTheme = "ClearDark"
AppleHighlightColor = "0.847059 0.847059 0.862745 Graphite"

[bootstrap.macos.defaults."com.apple.finder"]
AppleShowAllFiles = true
FXPreferredViewStyle = "Nlsv"
FXRemoveOldTrashItems = true

[bootstrap.macos.defaults."com.apple.dock"]
autohide = true
tilesize = 64.0
"workspaces-auto-swoosh" = false

[bootstrap.macos.defaults."com.apple.WindowManager"]
EnableTiledWindowMargins = false
HideDesktop = true
AppWindowGroupingBehavior = 1

[bootstrap.macos.defaults."com.apple.menuextra.clock"]
ShowAMPM = true

# Tap to click is stored for the built-in trackpad, Bluetooth trackpads, and per host.
[bootstrap.macos.defaults."com.apple.AppleMultitouchTrackpad"]
Clicking = true

[bootstrap.macos.defaults."com.apple.driver.AppleBluetoothMultitouch.trackpad"]
Clicking = true

[[bootstrap.macos.defaults_entries]]
domain = "NSGlobalDomain"
key = "com.apple.mouse.tapBehavior"
host = "current"
value = 1

# Runs on every `mise bootstrap`, changed or not.
# The screenshot location is written here because defaults values are not templated, so $HOME cannot be declared.
[bootstrap.hooks.post-defaults]
run = [
  'mkdir -p "$HOME/Pictures/screenshots"',
  'defaults write com.apple.screencapture location -string "$HOME/Pictures/screenshots"',
  "killall Finder Dock SystemUIServer 2>/dev/null || true",
]

[tasks.claude-install]
description = "install Claude CLI if not installed"
run = """
#!/usr/bin/env bash
echo "checking Claude CLI installation..."
if ! command -v claude &> /dev/null; then
  echo "Claude CLI not found, installing..."
  curl -fsSL https://claude.ai/install.sh | bash
else
  echo "Claude CLI is already installed"
fi
"""

[tasks.help]
description = "show available tasks"
run = "mise tasks"
