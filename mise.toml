# NOTE: Run `mise bootstrap` in the dotfiles directory

[dotfiles]
"~/.config/mise/config.toml" = "mise/config.toml"
"~/Brewfile" = "Brewfile"
"~/.zshrc" = "zsh/.zshrc"
"~/.config/starship.toml" = "starship/starship.toml"
"~/.config/ghostty/config" = "ghostty/config"
"~/.config/nvim/init.lua" = "neovim/init.lua"
"~/.config/zed/settings.json" = "zed/settings.json"
"~/.psqlrc" = "postgres/.psqlrc"
"~/.claude/CLAUDE.md" = "claude/CLAUDE.md"
"~/.claude/settings.json" = "claude/settings.json"
# Link the directory, not karabiner.json: Karabiner replaces a symlinked file with a regular one on save.
"~/.config/karabiner" = "karabiner"

# mise refuses to replace a target it did not create, so a real directory left by Karabiner is moved aside.
[bootstrap.hooks.pre-dotfiles]
run = [
  'target="$HOME/.config/karabiner"; if [ -e "$target" ] && [ ! -L "$target" ]; then mv "$target" "$target.bak.$(date +%Y%m%d%H%M%S)"; fi',
]

# Runs last in `mise bootstrap`.
[tasks.bootstrap]
description = "run the setup steps mise bootstrap cannot declare"
depends = ["brew", "claude-install"]

[tasks.brew]
description = "set up Homebrew"
run = """
#!/usr/bin/env bash
echo "setting up Homebrew..."
brew bundle --file="{{ config_root }}/Brewfile"
chmod 755 /opt/homebrew/share
"""

[tasks.brew-dump]
description = "dump current Brewfile"
run = """
#!/usr/bin/env bash
echo "dumping the current Brewfile..."
brew bundle dump --file="{{ config_root }}/Brewfile" --no-vscode --no-go --force
"""

[tasks.gitconfig]
description = "set up gitconfig (interactive)"
run = """
#!/usr/bin/env bash
echo "setting up gitconfig..."
mkdir -p "$HOME/go/src"
read -p "Enter your name: " name
read -p "Enter your email: " email
sed -e "s/Hoge Fuga/$name/" -e "s/hoge@example.com/$email/" -e "s/hogehogehoge/$USER/" "{{ config_root }}/git/gitconfig.template" > "$HOME/.gitconfig"
"""

[bootstrap.macos.defaults."com.apple.finder"]
AppleShowAllFiles = true

[bootstrap.macos.defaults."com.apple.dock"]
autohide = true

[bootstrap.macos.defaults.NSGlobalDomain]
KeyRepeat = 2
InitialKeyRepeat = 15

# Runs on every `mise bootstrap`, changed or not.
# The screenshot location is written here because defaults values are not templated, so $HOME cannot be declared.
[bootstrap.hooks.post-defaults]
run = [
  'mkdir -p "$HOME/Pictures/screenshots"',
  'defaults write com.apple.screencapture location -string "$HOME/Pictures/screenshots"',
  "killall Finder Dock SystemUIServer 2>/dev/null || true",
]

[tasks.claude-install]
description = "install Claude CLI if not installed"
run = """
#!/usr/bin/env bash
echo "checking Claude CLI installation..."
if ! command -v claude &> /dev/null; then
  echo "Claude CLI not found, installing..."
  curl -fsSL https://claude.ai/install.sh | bash
else
  echo "Claude CLI is already installed"
fi
"""

[tasks.help]
description = "show available tasks"
run = "mise tasks"
